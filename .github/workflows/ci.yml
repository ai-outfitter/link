name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Everything the release workflow depends on, run before the tag exists.
  # A failure at release time leaves a published GitHub release with nothing
  # on npm or GHCR behind it, so these checks belong on the pull request.
  package:
    name: Build, pack and run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The evidence-gate backends decide a milestone that was a hardcoded
      # literal before. These fixtures fail if following the remediation
      # instructions stops changing the report, which is the one property
      # that makes the advice worth giving.
      - name: Evidence backend fixtures
        run: npm run test:evidence

      # Install the tarball the way a consumer does, so a missing entry in
      # `files` (the catalog payload especially) fails here and not on npx.
      # `npm pack` runs prepack, which builds the site, so this also proves
      # the prebuilt site ships.
      - name: Pack and install as a consumer
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/ai-outfitter-link-*.tgz
          ./node_modules/.bin/link help | grep -q "audit organizations"
          # The scanner resolves its governance baseline by walking up from
          # dist/; prove the payload shipped rather than assuming it did.
          test -f node_modules/@ai-outfitter/link/governance/sdlc-baseline.yaml
          test -f node_modules/@ai-outfitter/link/dist-web/server/entry.mjs

      # The site must serve with no node_modules of its own and no Astro at
      # run time. A folder source scans through `git ls-files`, so this needs
      # no forge token, and it seeds the XDG report the site reads.
      # `review` is scan-then-serve in one command, and the container's
      # default, so exercising it covers both halves at once.
      - name: Scan and serve from the installed package
        run: |
          cd /tmp/consumer
          PORT=4321 ./node_modules/.bin/link review "$GITHUB_WORKSPACE" &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:4321/ 2>/dev/null && break || sleep 1
          done
          curl -fsS -o /dev/null -w 'GET / %{http_code}\n' http://localhost:4321/
          curl -fsS -o /dev/null -w 'GET /workflows %{http_code}\n' http://localhost:4321/workflows
          curl -fsS -o /dev/null -w 'GET /baseline %{http_code}\n' http://localhost:4321/baseline
          # The scan half must have produced both artefacts on disk.
          test -f report.json && test -f workflows.json
          kill %1

      # A single repository is a first-class target, not only an org. This
      # scans the workflow's own repository with its own token, so it needs
      # no extra secret.
      - name: Scan a single repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/consumer
          ./node_modules/.bin/link report "$GITHUB_REPOSITORY" --out /tmp/one-repo
          # Scoped, and labelled as scoped: a level derived from one
          # repository must never read as the organization's level.
          test "$(jq -r '.orgs[0].source_type' /tmp/one-repo/report.json)" = github-repo
          test "$(jq -r '.orgs[0].repos | length' /tmp/one-repo/report.json)" = 1
          jq -e '.evidence_limits | map(select(test("named repositories only"))) | length == 1' \
            /tmp/one-repo/report.json > /dev/null
          # The remediation plan is ranked, and the ranks are the product: a
          # gap in the sequence means a step was dropped after ordering.
          jq -e '.orgs[0].next_steps | [.[].rank] == [range(1; length + 1)]' \
            /tmp/one-repo/report.json > /dev/null

  image:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t link:ci .

      - name: Smoke test image
        run: |
          docker run --rm link:ci help | grep -q "audit organizations"
          docker run --rm --entrypoint sh link:ci -c 'gh --version && git --version'
